name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build, size-check and merge factory image
        run: bash tools/validate_firmware.sh
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-anki-esp32c3
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 30
